name: Build ESP32 firmware

on:
  push:
    branches:
      - main
    paths:
      - "main/**"
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Arduino CLI and ESP32 platform
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and ArduinoJson
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install ArduinoJson

      - name: Select next firmware version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest_path = Path("firmware/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          current = manifest.get("version", "0.0.0")
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", current)
          if not match:
              raise SystemExit(f"Manifest version must use MAJOR.MINOR.PATCH, got: {current}")
          major, minor, patch = map(int, match.groups())
          version = f"{major}.{minor}.{patch + 1}"

          sketch_path = Path("main/main.ino")
          sketch = sketch_path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(OTA_FIRMWARE_VERSION\s*=\s*")[^"]+("\s*;)',
              rf"\g<1>{version}\g<2>",
              sketch,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not find OTA_FIRMWARE_VERSION in main/main.ino")
          sketch_path.write_text(updated, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Building firmware version {version}")
          PY

      - name: Compile firmware
        run: |
          mkdir -p main/build
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir main/build main
          cp main/build/main.ino.bin main/build/firmware.bin

      - name: Generate manifest
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          binary = Path("main/build/firmware.bin")
          source = Path("main/main.ino").read_text(encoding="utf-8")
          match = re.search(r'OTA_DEVICE_MODEL\s*=\s*"([^"]+)"', source)
          if not match:
              raise SystemExit("Could not find OTA_DEVICE_MODEL in main/main.ino")

          version = os.environ["FIRMWARE_VERSION"]
          data = binary.read_bytes()
          manifest = {
              "device": match.group(1),
              "version": version,
              "url": f"https://github.com/smarthomebyvinay/ESPOTA/releases/download/v{version}/firmware.bin",
              "size": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
          }
          Path("firmware/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/manifest.json
          if git diff --cached --quiet; then
            echo "Manifest did not change; nothing to commit."
          else
            git commit -m "Update firmware manifest to v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release and upload firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${FIRMWARE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" main/build/firmware.bin --clobber
          else
            gh release create "$tag" main/build/firmware.bin \
              --title "ESP32 firmware ${FIRMWARE_VERSION}" \
              --notes "Automated firmware build from commit ${GITHUB_SHA}."
          fi

      - name: Save downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-v${{ steps.version.outputs.version }}
          path: main/build/firmware.bin
          if-no-files-found: error
          retention-days: 30
